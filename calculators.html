<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AgroMind — Tools</title><meta name="description" content="Spacing, fertilizer, irrigation, yield, seed-rate and compost calculators for the field.">
<link rel="stylesheet" href="core.css"><link rel="stylesheet" href="app.css"></head><body>
<div id="topbar"></div>
<main class="shell"><div class="page">
  <section class="phead" style="padding-bottom:26px"><div class="eyebrow">Field calculators</div><h1>Run the <em>numbers</em>.</h1></section>
  <div class="grid2 even">
    <div class="col">
      <section class="card reveal"><div class="ch"><h2>Fertilizer by N target</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Area m²</label><input class="inp" id="f_area" type="number" value="20"></div><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Target N g/m²</label><input class="inp" id="f_n" type="number" value="10"></div><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Fertilizer %N</label><input class="inp" id="f_pct" type="number" value="20"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="f_out"></div><div class="l">fertilizer needed</div></div></div></section>
      <section class="card reveal"><div class="ch"><h2>Irrigation (ET-based)</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Area m²</label><input class="inp" id="i_area" type="number" value="20"></div><div class="fld" style="margin:0;flex:1;min-width:120px"><label>Crop ET mm/day</label><input class="inp" id="i_etc" type="number" value="5"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="i_out"></div><div class="l">water per day (1mm·m² = 1L)</div></div></div></section>
      <section class="card reveal"><div class="ch"><h2>Compost mix</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Greens (parts)</label><input class="inp" id="c_green" type="number" value="1"></div><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Browns (parts)</label><input class="inp" id="c_brown" type="number" value="2"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="c_out"></div><div class="l" id="c_note">target 2–3 : 1</div></div></div></section>
    </div>
    <div class="col">
      <section class="card reveal"><div class="ch"><h2>Yield estimate</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:100px"><label>Plants</label><input class="inp" id="y_pl" type="number" value="24"></div><div class="fld" style="margin:0;flex:1;min-width:120px"><label>Yield / plant</label><input class="inp" id="y_per" type="number" value="3"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="y_out"></div><div class="l">estimated harvest</div></div></div></section>
      <section class="card reveal"><div class="ch"><h2>Seed rate</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:90px"><label>Area m²</label><input class="inp" id="s_area" type="number" value="20"></div><div class="fld" style="margin:0;flex:1;min-width:110px"><label>Plants / m²</label><input class="inp" id="s_den" type="number" value="16"></div><div class="fld" style="margin:0;flex:1;min-width:110px"><label>Germination %</label><input class="inp" id="s_germ" type="number" value="85"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="s_out"></div><div class="l">seeds to sow</div></div></div></section>
      <section class="card reveal"><div class="ch"><h2>Plant count (bed)</h2></div><div style="padding:20px"><div class="row"><div class="fld" style="margin:0;flex:1;min-width:90px"><label>Length m</label><input class="inp" id="sp_l" type="number" value="3"></div><div class="fld" style="margin:0;flex:1;min-width:90px"><label>Width m</label><input class="inp" id="sp_w" type="number" value="1.2"></div><div class="fld" style="margin:0;flex:1;min-width:110px"><label>Spacing cm</label><input class="inp" id="sp_s" type="number" value="30"></div></div><div class="metric" style="margin-top:18px"><div class="n" id="sp_out"></div><div class="l">plants that fit</div></div></div></section>
    </div>
  </div>
</div></main><script src="three.min.js"></script><script src="app.js"></script><script src="core.js"></script></body></html>
